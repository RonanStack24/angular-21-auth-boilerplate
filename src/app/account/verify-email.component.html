<h3 class="card-header">Verify Email</h3>
<div class="card-body">
    <div *ngIf="status === 'verifying'" class="text-center p-3">
        <span class="spinner-border spinner-border-lg"></span>
        <div class="mt-2">Verifying...</div>
    </div>
    <div *ngIf="status === 'failed'">
        Verification failed. you can also verify your account using the <a routerLink="/account/forgot-password">forgot
            password</a> page.
    </div>
</div>
