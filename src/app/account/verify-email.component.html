<h3 class="card-header">Verify Email</h3>
<div class="card-body">
    <div *ngIf="emailStatus == EmailStatus.Verifying" class="text-center p-3">
        <span class="spinner-border spinner-border-lg"></span>
        <div class="mt-2">Verifying...</div>
    </div>
    <div *ngIf="emailStatus == EmailStatus.Failed">
        Verification failed. you can also verify your account using the <a routerLink="forgot-password">forgot
            password</a> page.
    </div>
</div>
